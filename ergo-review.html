<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERGO Hypercare - Email Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e0e4e8;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #d4145a 0%, #ff6b6b 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
        }

        .logo h1 {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }

        .logo span {
            font-size: 12px;
            color: #666;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #d4145a;
            color: #fff;
        }

        .btn-primary:hover {
            background: #b8114d;
        }

        .btn-secondary {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        .btn-success {
            background: #10b981;
            color: #fff;
        }

        .btn-success:hover {
            background: #059669;
        }

        /* Stats Bar */
        .stats-bar {
            background: #fff;
            border-bottom: 1px solid #e0e4e8;
            padding: 16px 24px;
            display: flex;
            gap: 32px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
        }

        .stat-item.highlight .stat-value {
            color: #d4145a;
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: #fff;
            border-bottom: 1px solid #e0e4e8;
            padding: 0 24px;
            display: flex;
            gap: 0;
        }

        .nav-tab {
            padding: 16px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .nav-tab:hover {
            color: #333;
            background: #f9fafb;
        }

        .nav-tab.active {
            color: #d4145a;
            border-bottom-color: #d4145a;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 180px);
        }

        /* Sidebar - List */
        .sidebar {
            width: 380px;
            background: #fff;
            border-right: 1px solid #e0e4e8;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #e0e4e8;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .search-box:focus {
            border-color: #d4145a;
            box-shadow: 0 0 0 3px rgba(212, 20, 90, 0.1);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Group Header */
        .group-header {
            padding: 12px 16px;
            background: #f5f7fa;
            border-bottom: 1px solid #e0e4e8;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: sticky;
            top: 0;
        }

        .group-header:hover {
            background: #eef1f5;
        }

        .group-count {
            background: #e0e4e8;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
        }

        /* Email Item */
        .email-item {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .email-item:hover {
            background: #f9fafb;
        }

        .email-item.selected {
            background: #fef2f5;
            border-left: 3px solid #d4145a;
        }

        .email-item.unread {
            background: #fffbeb;
        }

        .email-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .email-sender {
            font-weight: 600;
            font-size: 14px;
            color: #1a1a2e;
        }

        .email-date {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }

        .email-subject {
            font-size: 13px;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-preview {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .email-meta {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .email-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .tag-kunde {
            background: #dbeafe;
            color: #1e40af;
        }

        .tag-replies {
            background: #f0fdf4;
            color: #166534;
        }

        .tag-status-neu {
            background: #fef3c7;
            color: #92400e;
        }

        .tag-status-bearbeitung {
            background: #dbeafe;
            color: #1e40af;
        }

        .tag-status-erledigt {
            background: #d1fae5;
            color: #065f46;
        }

        /* Detail Panel */
        .detail-panel {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .detail-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e0e4e8;
        }

        .detail-subject {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .detail-meta {
            display: flex;
            gap: 24px;
            font-size: 13px;
            color: #666;
        }

        .detail-meta strong {
            color: #333;
        }

        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Message Block */
        .message-block {
            margin-bottom: 24px;
            border: 1px solid #e0e4e8;
            border-radius: 12px;
            overflow: hidden;
        }

        .message-header {
            padding: 14px 18px;
            background: #f9fafb;
            border-bottom: 1px solid #e0e4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .message-header.incoming {
            background: #fef2f5;
        }

        .message-header.outgoing {
            background: #f0fdf4;
        }

        .message-from {
            font-weight: 600;
            font-size: 14px;
        }

        .message-date {
            font-size: 12px;
            color: #888;
        }

        .message-body {
            padding: 18px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .message-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .message-label.anfrage {
            color: #d4145a;
        }

        .message-label.antwort {
            color: #10b981;
        }

        /* Edit Panel */
        .edit-panel {
            padding: 20px 24px;
            background: #f9fafb;
            border-top: 1px solid #e0e4e8;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.wide {
            grid-column: span 2;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #d4145a;
            box-shadow: 0 0 0 3px rgba(212, 20, 90, 0.1);
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #666;
        }

        /* Upload Screen */
        .upload-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100vh - 100px);
            padding: 40px;
        }

        .upload-box {
            width: 100%;
            max-width: 500px;
            padding: 60px 40px;
            border: 2px dashed #ddd;
            border-radius: 16px;
            text-align: center;
            background: #fff;
            transition: all 0.2s;
        }

        .upload-box:hover, .upload-box.dragover {
            border-color: #d4145a;
            background: #fef2f5;
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: #f5f7fa;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon svg {
            width: 32px;
            height: 32px;
            color: #888;
        }

        .upload-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .upload-subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f5f7fa;
        }

        ::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            background: #1a1a2e;
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">E</div>
            <div>
                <h1>ERGO Hypercare</h1>
                <span>Email Review Tool</span>
            </div>
        </div>
        <div class="header-actions">
            <input type="file" id="fileInput" accept=".json" style="display: none;">
            <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                JSON laden
            </button>
            <button class="btn btn-success" onclick="exportCSV()" id="exportBtn" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                CSV Export
            </button>
        </div>
    </header>

    <!-- Upload Screen -->
    <div id="uploadScreen" class="upload-screen">
        <div class="upload-box" id="uploadBox">
            <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
            </div>
            <div class="upload-title">JSON-Datei hier ablegen</div>
            <div class="upload-subtitle">oder klicken zum Auswählen</div>
            <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                Datei auswählen
            </button>
        </div>
    </div>

    <!-- Main App (hidden until data loaded) -->
    <div id="mainApp" class="hidden">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-item highlight">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Vorgänge gesamt</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statKunden">0</div>
                <div class="stat-label">Kunden</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statMakler">0</div>
                <div class="stat-label">Makler</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statNeu">0</div>
                <div class="stat-label">Neu</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statBearbeitung">0</div>
                <div class="stat-label">In Bearbeitung</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statErledigt">0</div>
                <div class="stat-label">Erledigt</div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <div class="nav-tab active" data-view="emails" onclick="switchView('emails')">
                Alle Emails
            </div>
            <div class="nav-tab" data-view="kunden" onclick="switchView('kunden')">
                Nach Kunde
            </div>
            <div class="nav-tab" data-view="makler" onclick="switchView('makler')">
                Nach Makler
            </div>
        </nav>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <input type="text" class="search-box" placeholder="Suchen..." id="searchInput" oninput="filterEmails()">
                </div>
                <div class="sidebar-list" id="emailList">
                    <!-- Email items will be rendered here -->
                </div>
            </aside>

            <!-- Detail Panel -->
            <main class="detail-panel">
                <div id="detailEmpty" class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <h3>Keine Email ausgewählt</h3>
                    <p>Wählen Sie eine Email aus der Liste aus</p>
                </div>

                <div id="detailContent" class="hidden">
                    <div class="detail-header">
                        <div class="detail-subject" id="detailSubject">Betreff</div>
                        <div class="detail-meta">
                            <span><strong>Von:</strong> <span id="detailFrom"></span></span>
                            <span><strong>Datum:</strong> <span id="detailDate"></span></span>
                            <span><strong>Antworten:</strong> <span id="detailReplies"></span></span>
                        </div>
                    </div>

                    <div class="detail-content" id="detailMessages">
                        <!-- Messages will be rendered here -->
                    </div>

                    <div class="edit-panel">
                        <div class="edit-grid">
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select class="form-select" id="editStatus" onchange="updateEmail('status')">
                                    <option value="Neu">Neu</option>
                                    <option value="In Bearbeitung">In Bearbeitung</option>
                                    <option value="Erledigt">Erledigt</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Bearbeiter</label>
                                <select class="form-select" id="editBearbeiter" onchange="updateEmail('bearbeiter')">
                                    <option value="">-- Auswählen --</option>
                                    <option value="Sarina">Sarina</option>
                                    <option value="Susanne">Susanne</option>
                                    <option value="Ulrika">Ulrika</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Kunde</label>
                                <input type="text" class="form-input" id="editKunde" onchange="updateEmail('kunde')">
                            </div>
                            <div class="form-group">
                                <label class="form-label">VS-Nr.</label>
                                <input type="text" class="form-input" id="editVsnr" onchange="updateEmail('vsnr')">
                            </div>
                            <div class="form-group wide">
                                <label class="form-label">Kommentar</label>
                                <input type="text" class="form-input" id="editKommentar" onchange="updateEmail('kommentar')">
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // ============================================================================
        // STATE
        // ============================================================================
        let emails = [];
        let filteredEmails = [];
        let selectedEmailId = null;
        let currentView = 'emails';

        // ============================================================================
        // FILE LOADING
        // ============================================================================
        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        const uploadBox = document.getElementById('uploadBox');
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });
        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });
        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.json')) {
                loadFile(file);
            }
        });
        uploadBox.addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                loadFile(file);
            }
        }

        function loadFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    processData(data);
                    showNotification('Datei geladen: ' + file.name);
                } catch (err) {
                    showNotification('Fehler beim Laden: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function processData(data) {
            // Handle different JSON formats
            if (data.conversations) {
                emails = convertConversations(data.conversations);
            } else if (Array.isArray(data)) {
                emails = data.map((e, i) => ({
                    id: i + 1,
                    ...normalizeEmail(e)
                }));
            } else {
                emails = [{ id: 1, ...normalizeEmail(data) }];
            }

            // Initialize fields
            emails.forEach(email => {
                email.status = email.status || 'Neu';
                email.bearbeiter = email.bearbeiter || '';
                email.kunde = email.kunde || extractKunde(email);
                email.makler = email.makler || email.von_name || '';
                email.vsnr = email.vsnr || '';
                email.kommentar = email.kommentar || '';
            });

            filteredEmails = [...emails];

            document.getElementById('uploadScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('exportBtn').disabled = false;

            updateStats();
            renderEmailList();
        }

        function convertConversations(conversations) {
            const result = [];
            let id = 1;

            for (const convId in conversations) {
                const conv = conversations[convId];
                const messages = conv.messages || [];
                if (messages.length === 0) continue;

                // Sort by time
                messages.sort((a, b) => {
                    const timeA = a.receivedTime || a.sentOn || '';
                    const timeB = b.receivedTime || b.sentOn || '';
                    return timeA < timeB ? -1 : 1;
                });

                // Find inbox root
                let rootMsg = messages.find(m => m.folder === 'inbox') || messages[0];

                const email = {
                    id: id++,
                    emailId: rootMsg.entryID || '',
                    conversationId: convId,
                    datum: rootMsg.receivedTime || rootMsg.sentOn || '',
                    von_email: rootMsg.senderEmail || '',
                    von_name: rootMsg.senderName || '',
                    betreff: rootMsg.subject || conv.subject || '',
                    text: rootMsg.body || rootMsg.bodyPreview || '',
                    antworten: []
                };

                // Add replies
                messages.forEach(msg => {
                    if (msg.entryID === rootMsg.entryID) return;
                    const isSent = msg.folder === 'sent';
                    email.antworten.push({
                        datum: msg.sentOn || msg.receivedTime || '',
                        von: isSent ? 'ERGO (gesendet)' : (msg.senderName || msg.senderEmail || ''),
                        text: msg.body || msg.bodyPreview || '',
                        isIncoming: !isSent
                    });
                });

                result.push(email);
            }

            // Sort by date descending
            result.sort((a, b) => (b.datum || '') > (a.datum || '') ? 1 : -1);

            return result;
        }

        function normalizeEmail(e) {
            return {
                emailId: e.emailId || e.entryID || '',
                conversationId: e.conversationId || '',
                datum: e.datum || e.receivedTime || '',
                von_email: e.von_email || e.senderEmail || '',
                von_name: e.von_name || e.senderName || '',
                betreff: e.betreff || e.subject || '',
                text: e.text || e.body || '',
                antworten: e.antworten || []
            };
        }

        function extractKunde(email) {
            // Try to extract customer name from email body
            const text = email.text || '';
            const patterns = [
                /Kunde[:\s]+([^\n,]+)/i,
                /Versicherungsnehmer[:\s]+([^\n,]+)/i,
                /VN[:\s]+([^\n,]+)/i,
                /Name[:\s]+([^\n,]+)/i
            ];
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) return match[1].trim();
            }
            return '';
        }

        // ============================================================================
        // VIEWS
        // ============================================================================
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.view === view);
            });
            renderEmailList();
        }

        function filterEmails() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            filteredEmails = emails.filter(email => {
                const searchable = [
                    email.von_name,
                    email.von_email,
                    email.betreff,
                    email.text,
                    email.kunde,
                    email.makler
                ].join(' ').toLowerCase();
                return searchable.includes(search);
            });
            renderEmailList();
        }

        function renderEmailList() {
            const container = document.getElementById('emailList');

            if (currentView === 'kunden') {
                renderGroupedList(container, 'kunde', 'Kein Kunde');
            } else if (currentView === 'makler') {
                renderGroupedList(container, 'makler', 'Unbekannter Makler');
            } else {
                renderFlatList(container);
            }
        }

        function renderFlatList(container) {
            const sorted = [...filteredEmails].sort((a, b) =>
                (b.datum || '') > (a.datum || '') ? 1 : -1
            );

            container.innerHTML = sorted.map(email => renderEmailItem(email)).join('');
        }

        function renderGroupedList(container, groupBy, defaultGroup) {
            const groups = {};
            filteredEmails.forEach(email => {
                const key = email[groupBy] || defaultGroup;
                if (!groups[key]) groups[key] = [];
                groups[key].push(email);
            });

            const sortedGroups = Object.keys(groups).sort();

            container.innerHTML = sortedGroups.map(group => `
                <div class="group-header">
                    <span>${escapeHtml(group)}</span>
                    <span class="group-count">${groups[group].length}</span>
                </div>
                ${groups[group].map(email => renderEmailItem(email)).join('')}
            `).join('');
        }

        function renderEmailItem(email) {
            const statusClass = {
                'Neu': 'tag-status-neu',
                'In Bearbeitung': 'tag-status-bearbeitung',
                'Erledigt': 'tag-status-erledigt'
            }[email.status] || 'tag-status-neu';

            return `
                <div class="email-item ${email.id === selectedEmailId ? 'selected' : ''}"
                     onclick="selectEmail(${email.id})">
                    <div class="email-header">
                        <span class="email-sender">${escapeHtml(email.von_name || email.von_email || 'Unbekannt')}</span>
                        <span class="email-date">${formatDate(email.datum)}</span>
                    </div>
                    <div class="email-subject">${escapeHtml(email.betreff || '(Kein Betreff)')}</div>
                    <div class="email-preview">${escapeHtml(truncate(email.text, 80))}</div>
                    <div class="email-meta">
                        ${email.kunde ? `<span class="email-tag tag-kunde">${escapeHtml(email.kunde)}</span>` : ''}
                        ${email.antworten.length > 0 ? `<span class="email-tag tag-replies">${email.antworten.length} Antworten</span>` : ''}
                        <span class="email-tag ${statusClass}">${email.status}</span>
                    </div>
                </div>
            `;
        }

        // ============================================================================
        // DETAIL VIEW
        // ============================================================================
        function selectEmail(id) {
            selectedEmailId = id;
            const email = emails.find(e => e.id === id);

            if (!email) return;

            document.getElementById('detailEmpty').classList.add('hidden');
            document.getElementById('detailContent').classList.remove('hidden');

            document.getElementById('detailSubject').textContent = email.betreff || '(Kein Betreff)';
            document.getElementById('detailFrom').textContent = email.von_name || email.von_email || 'Unbekannt';
            document.getElementById('detailDate').textContent = formatDateTime(email.datum);
            document.getElementById('detailReplies').textContent = email.antworten.length;

            // Render messages
            let messagesHtml = `
                <div class="message-block">
                    <div class="message-header incoming">
                        <div>
                            <div class="message-label anfrage">Anfrage</div>
                            <div class="message-from">${escapeHtml(email.von_name || email.von_email)}</div>
                        </div>
                        <div class="message-date">${formatDateTime(email.datum)}</div>
                    </div>
                    <div class="message-body">${escapeHtml(email.text || '(Kein Inhalt)')}</div>
                </div>
            `;

            email.antworten.forEach((reply, idx) => {
                const isOutgoing = !reply.isIncoming;
                messagesHtml += `
                    <div class="message-block">
                        <div class="message-header ${isOutgoing ? 'outgoing' : 'incoming'}">
                            <div>
                                <div class="message-label antwort">Antwort ${idx + 1}</div>
                                <div class="message-from">${escapeHtml(reply.von || 'Unbekannt')}</div>
                            </div>
                            <div class="message-date">${formatDateTime(reply.datum)}</div>
                        </div>
                        <div class="message-body">${escapeHtml(reply.text || '(Kein Inhalt)')}</div>
                    </div>
                `;
            });

            document.getElementById('detailMessages').innerHTML = messagesHtml;

            // Fill edit form
            document.getElementById('editStatus').value = email.status || 'Neu';
            document.getElementById('editBearbeiter').value = email.bearbeiter || '';
            document.getElementById('editKunde').value = email.kunde || '';
            document.getElementById('editVsnr').value = email.vsnr || '';
            document.getElementById('editKommentar').value = email.kommentar || '';

            renderEmailList();
        }

        function updateEmail(field) {
            if (!selectedEmailId) return;
            const email = emails.find(e => e.id === selectedEmailId);
            if (!email) return;

            const fieldMap = {
                'status': 'editStatus',
                'bearbeiter': 'editBearbeiter',
                'kunde': 'editKunde',
                'vsnr': 'editVsnr',
                'kommentar': 'editKommentar'
            };

            email[field] = document.getElementById(fieldMap[field]).value;
            updateStats();
            renderEmailList();
        }

        // ============================================================================
        // STATS
        // ============================================================================
        function updateStats() {
            document.getElementById('statTotal').textContent = emails.length;

            const kunden = new Set(emails.map(e => e.kunde).filter(k => k));
            document.getElementById('statKunden').textContent = kunden.size;

            const makler = new Set(emails.map(e => e.makler).filter(m => m));
            document.getElementById('statMakler').textContent = makler.size;

            document.getElementById('statNeu').textContent = emails.filter(e => e.status === 'Neu').length;
            document.getElementById('statBearbeitung').textContent = emails.filter(e => e.status === 'In Bearbeitung').length;
            document.getElementById('statErledigt').textContent = emails.filter(e => e.status === 'Erledigt').length;
        }

        // ============================================================================
        // CSV EXPORT
        // ============================================================================
        function exportCSV() {
            const headers = [
                'ID', 'Datum', 'Makler', 'Makler Email', 'Kunde', 'VS-Nr',
                'Betreff', 'Anfrage', 'Status', 'Bearbeiter', 'Kommentar',
                'Anzahl Antworten'
            ];

            const rows = emails.map(email => [
                email.id,
                formatDate(email.datum),
                email.makler || email.von_name || '',
                email.von_email || '',
                email.kunde || '',
                email.vsnr || '',
                email.betreff || '',
                truncate(email.text, 500).replace(/[\n\r]+/g, ' '),
                email.status || '',
                email.bearbeiter || '',
                email.kommentar || '',
                email.antworten.length
            ]);

            const csvContent = [
                headers.join(';'),
                ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';'))
            ].join('\n');

            const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ergo_vorgaenge_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            showNotification(`${emails.length} Vorgänge exportiert`);
        }

        // ============================================================================
        // UTILITIES
        // ============================================================================
        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('de-DE');
            } catch {
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('de-DE') + ', ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            } catch {
                return dateStr;
            }
        }

        function truncate(str, len) {
            if (!str) return '';
            str = str.replace(/\s+/g, ' ').trim();
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function showNotification(message) {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.textContent = message;
            document.body.appendChild(notif);

            setTimeout(() => notif.remove(), 3000);
        }
    </script>
</body>
</html>
